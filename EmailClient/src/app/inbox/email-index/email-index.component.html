<div class="ui celled list">
  @for (email of emails?.messages; track email) {
    <div class="item">
      <a [routerLink]="email.id" routerLinkActive="active">
        <div class="content">
          <div class="header trim">
            {{ email.subject }}
          </div>
          <p class="trim">
            {{ email.from }}
          </p>
        </div>
      </a>
    </div>
  }
</div>
