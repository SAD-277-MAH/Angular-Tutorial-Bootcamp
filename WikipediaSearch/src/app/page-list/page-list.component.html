<table class="table is-striped">
  <thead>
    <tr>
      <th>Title</th>
      <th>Word Count</th>
      <th>Snippet</th>
    </tr>
  </thead>

  <tbody>
    @for (page of data; track page) {
      <tr>
        <td>
          <a
          [href]="'https://en.wikipedia.org?curid=' + page.pageid"
          target="_blank"
          >{{ page.title }}</a
        >
      </td>
      <td>{{ page.wordcount }}</td>
      <td [innerHTML]="page.snippet"></td>
    </tr>
}
  </tbody>
</table>
